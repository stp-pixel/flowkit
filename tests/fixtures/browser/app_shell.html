<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App-shell fixture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.4 sans-serif; }
  #pane { height: 100vh; overflow: auto; }
  #pane .top { padding: 8px; }
  #pane .tall { height: 1800px; }
</style>
</head>
<body>
  <!-- App-shell layout: the document never scrolls, the pane does. -->
  <div id="pane">
    <div class="top"><button type="button">Top button</button></div>
    <div class="tall"></div>
    <button type="button" id="deep">Deep button</button>
  </div>
</body>
</html>
